name: checks
on: [push, pull_request]
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline checks
        run: sh prototype/build.sh
      - name: Verify source manifest
        run: |
          git ls-files | grep -v SOURCE-MANIFEST | xargs shasum -a 256 > "$RUNNER_TEMP/manifest"
          diff -u SOURCE-MANIFEST.sha256 "$RUNNER_TEMP/manifest"
